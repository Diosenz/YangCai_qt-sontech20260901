; 在线纠偏工件局部定位；启动运行时读取。关闭仅停用工件位姿更新，不停用轨迹纠偏。
enabled=true
sample_interval_ms=200
minimum_match_interval_ms=2000
minimum_frames=8
maximum_frames=16
maximum_points_per_cloud=512
maximum_iterations=40
; ICP 最大对应点距离，单位 mm；界面可在 0.1~10 内调整当前运行时的值。
max_correspondence_distance_mm=5.0
; 超预算结果不写回；PCL 当前没有硬中断接口。
maximum_solve_time_ms=300
; 单次修正三轴合成平移长度上限，单位 mm；默认5，界面可调到10，超过则整次拒绝。
maximum_translation_mm=5.0
maximum_rotation_deg=1.0
minimum_improvement_ratio=0.05
maximum_residual_mm=2.0
