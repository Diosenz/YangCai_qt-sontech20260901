; 在线纠偏工件局部定位；启动运行时读取。关闭仅停用工件位姿更新，不停用轨迹纠偏。
enabled=true
sample_interval_ms=200
minimum_match_interval_ms=2000
minimum_frames=8
maximum_frames=16
maximum_points_per_cloud=512
maximum_iterations=40
; ICP 最大对应点距离，单位 mm；界面可在 0.1~10 内调整当前运行时的值。
max_correspondence_distance_mm=10.0
; 超预算结果不写回；PCL 当前没有硬中断接口。
maximum_solve_time_ms=2500
; 单次修正三轴合成平移长度上限，单位 mm；默认30，界面可调到30，超过则整次拒绝。
maximum_translation_mm=30.0
maximum_rotation_deg=10.0
minimum_improvement_ratio=0.05
; 启动靠拢联调：统一放宽配准后平均最近邻残差，仍需至少改善5%，后续不自动收紧。
maximum_residual_mm=5.5
; 独立于表面ICP的融合前KCF焊点验收；不把跟踪点视为真值，失效/跳变拒绝更新。
maximum_independent_error_mm=5.5
maximum_independent_worsening_mm=0.1
; 修正后两向点云覆盖与匹配区域跨度，防止仅一小片错误区域降低均值。
coverage_distance_mm=3.0
minimum_bidirectional_coverage=0.7
minimum_matched_spread_ratio=0.5
; 相对本会话初始工件位姿，旋转引起的焊点位移同时受限。
maximum_cumulative_translation_mm=30.0
maximum_cumulative_rotation_deg=10.0
maximum_keypoint_displacement_mm=30.0
; 每次尝试独立保存可重放JSON；达到预算暂停接受新的写回，不覆盖旧归档。
maximum_archived_attempts_per_session=128
